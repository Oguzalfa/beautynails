<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag: Beauty Nails Ads measurement -->
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-N8X57DRK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    </script>
    <!-- Site Telefon Tıklaması: report the salon's phone-link clicks. -->
    <script>
      function gtag_report_conversion(url) {
        var callback = function () {
          if (typeof url !== 'undefined') {
            window.location = url;
          }
        };
        gtag('event', 'conversion', {
          'send_to': 'AW-18514909573/KwJmCKin7r4dEIWzzPxE',
          'event_callback': callback
        });
        return false;
      }
      (function () {
        if (window.__beautyNailsPhoneClickBound) return;
        window.__beautyNailsPhoneClickBound = true;
        document.addEventListener('click', function (event) {
          if (event.defaultPrevented || event.button > 0) return;
          var target = event.target;
          var link = target && typeof target.closest === 'function'
            ? target.closest('a[href]')
            : null;
          if (!link) return;
          var href = (link.getAttribute('href') || '').toLowerCase().replace(/[\s().-]/g, '');
          if (href !== 'tel:+905322422303') return;
          try {
            // No URL: the browser opens the native tel link without waiting for analytics.
            gtag_report_conversion();
          } catch (_) {
            // Phone links remain usable when measurement is unavailable.
          }
        }, { passive: true });
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

      name="description"
      content="BeautyNails — tırnak sanatı, ipek kirpik, kalıcı makyaj ve erkek manikür & pedikür."

    <link rel="preload" as="image" href="/images/satin/hero-desktop-960.webp" media="(min-width: 1024px)" fetchpriority="high" type="image/webp" />
    <title>BeautyNails · Nail & Beauty Studio</title>
